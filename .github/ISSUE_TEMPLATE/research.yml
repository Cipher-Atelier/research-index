name: Work on existing research
description: Coordinate a task or share evidence, a reproduction, a correction, or a documentation issue.
title: "[Research] "
assignees: [cayde-6]
body:
  - type: markdown
    attributes:
      value: |
        Use the relevant project repository when possible. If an issue already covers this work, comment there instead of opening a duplicate.
        A small source lead or documentation fix is welcome. Independent replication and constructive challenges do not need advance permission.
        For a new investigation, use Propose new research in Cipher-Atelier/research-index.
        This issue is public. Do not upload private data, restricted scans, or material you lack permission to share.
  - type: textarea
    id: target
    attributes:
      label: Project and specific task
      description: Link the repository and relevant issue, claim, source location, or documentation passage. What do you want to check, improve, or contribute?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or proposed approach
      description: Give a source reference, a small plan, a correction, or a reproduction result. For completed tests, include inputs, versions, steps, expected output, and actual output. Explain missing evidence.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Uncertainty, credit, and coordination
      description: Note assumptions, alternatives, failed checks, related work in progress, earlier researchers or known keys, relevant AI assistance, and any access or reuse limits. Include only what applies.
    validations:
      required: false
