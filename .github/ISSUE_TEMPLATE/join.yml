name: Community introduction
description: Optional public introduction and research discussion.
title: "[Introduction] "
assignees: [cayde-6]
body:
  - type: markdown
    attributes:
      value: |
        Welcome to Cipher-Atelier. This issue is public.
        Use this optional issue for a public introduction and research discussion.
        Use your GitHub identity and share only a brief introduction and research interests.
        Do not include your email, address, telephone number, age, employer details, or other private personal information.
        You can contribute through issues and pull requests without organization membership.
        Participation is free. A public introduction does not create membership or repository permissions.
        For founder contact or a membership application, email Maxim Egorov privately at maxim.egorov.dev@gmail.com (mailto:maxim.egorov.dev@gmail.com). This public form is not a membership application.
        In your private membership application, include your contact email address, a link to your GitHub profile, and a brief explanation of why you want to join. Send these details only by email; do not post your contact email in a public issue.
  - type: textarea
    id: introduction
    attributes:
      label: Public GitHub introduction
      description: A short introduction using your public GitHub identity is enough. No real name or credentials are required.
      placeholder: "I’m @your-handle. I’d like to take part in the research here."
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: Research interests
      description: What questions, sources, or methods would you like to explore?
      placeholder: "For example: historical languages, transcription, ciphers, source checking, or reproducible experiments."
    validations:
      required: true
