name: Community introduction
description: Introduce your public GitHub identity and research interests.
title: "[Introduction] "
body:
  - type: markdown
    attributes:
      value: |
        Welcome to Cipher-Atelier. This issue is public.
        Use your GitHub identity and share only a brief introduction and research interests.
        Do not include your email, address, telephone number, age, employer details, or other private personal information.
        You can contribute through issues and pull requests without organization membership.
        Participation is free. Maxim Egorov (@cayde-6) decides organization invitations manually.
        An introduction does not create membership, an automatic role, or a guaranteed review time.
  - type: textarea
    id: introduction
    attributes:
      label: Public GitHub introduction
      description: A short introduction using your public GitHub identity is enough. No real name or credentials are required.
      placeholder: "I’m @your-handle. I’d like to take part in the research here."
    validations:
      required: true
  - type: textarea
    id: interests
    attributes:
      label: Research interests
      description: What questions, sources, or methods would you like to explore?
      placeholder: "For example: historical languages, transcription, ciphers, source checking, or reproducible experiments."
    validations:
      required: true
